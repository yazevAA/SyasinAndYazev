<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Vertex Multiplayer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Фон со звездами -->
    <div class="star-field">
        <span class="star" style="top: 10%; left: 20%;">+</span>
        <span class="star" style="top: 15%; left: 80%;">x</span>
        <span class="star" style="top: 50%; left: 10%;">+</span>
        <span class="star" style="top: 70%; left: 85%;">x</span>
        <span class="star" style="top: 30%; left: 50%;">+</span>
        <span class="star" style="top: 80%; left: 30%;">x</span>
        <span class="star" style="top: 5%; left: 60%;">+</span>
        <span class="star" style="top: 90%; left: 90%;">x</span>
    </div>

    <!-- Основной контент -->
    <div class="menu-container">
        <h1 class="title">Space Vertex</h1>
        <h2 class="subtitle">Multiplayer</h2>

        <div class="buttons">
            <button class="btn">CREATE GAME</button>
            <button class="btn">JOIN GAME</button>
            <button class="btn">DIRECT CONNECTION</button>
        </div>
    </div>

    <!-- Логотип в углу -->
    <div class="logo">SyasinYazev.lmao</div>

</body>
</html>
